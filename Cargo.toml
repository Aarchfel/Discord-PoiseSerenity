[package]
name = "theta_bot"
version = "0.1.0" # Might change the version after i finished this project
edition = "2024"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[dependencies]
# Core Discord Framework & Runtime
poise = "0.6.2"
tokio = { version = "1.53.1", features = ["full"] }

# Serialization & Configuration
serde = { version = "1.0", features = ["derive"] }
dotenvy = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Audio & Voice
songbird = { version = "0.6.0", features = ["builtin-queue", "serenity"] }
reqwest = "0.11"

# Allocator
mimalloc = "0.1"

# Utilities
chrono = "0.4"
sysinfo = "0.39"
