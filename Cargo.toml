[package]
name = "theta_bot"
version = "0.1.0" # Might change the version after i finished this project
edition = "2024"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[dependencies]
# Core Discord Framework & Runtime
poise = "0.6.2"
serenity = "0.12"
tokio = { version = "1.53", features = ["full"] }

# Serialization & Configuration
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"

# Database & Storage
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "sqlite", "macros", "chrono", "json"] }

# Logging & Error
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"

# Audio & Voice
songbird = { version = "0.6.0", features = ["builtin-queue", "serenity"] }
reqwest = "0.11"

# Allocator
mimalloc = "0.1"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
sysinfo = "0.39"
async-trait = "0.1"
